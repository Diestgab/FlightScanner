name: Monitor de Passagens LATAM

on:
  schedule:
    # Executa a cada 30 minutos (Expressão Cron)
    - cron: '*/30 * * * *'
  workflow_dispatch: # Permite que você clique em um botão para rodar manualmente se quiser

jobs:
  check-price:
    runs-on: ubuntu-22.04

    steps:
    - name: Baixar o código do repositório
      uses: actions/checkout@v3

    - name: Configurar o Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Instalar dependências do Python
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Instalar navegadores do Playwright
      run: |
        python -m playwright install chromium
        python -m playwright install-deps chromium

    - name: Executar o monitoramento de preço
      env:
        # Mapeia os Secrets que você vai cadastrar no GitHub
        TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        PRECO_MAXIMO: ${{ vars.PRECO_MAXIMO }}
      run: python latam.py