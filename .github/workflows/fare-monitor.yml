name: Monitor de Passagens LATAM

on:
  schedule:
    - cron: '2-59/5 * * * *'
    - cron: '4-59/10 * * * *'
    - cron: '1-59/15 * * * *'
    - cron: '3,33 * * * *'
    - cron: '6 * * * *'
  workflow_dispatch:

jobs:
  check-price:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (vars.MONITOR_INTERVAL_MINUTES == '5' && github.event.schedule == '2-59/5 * * * *') ||
      (vars.MONITOR_INTERVAL_MINUTES == '10' && github.event.schedule == '4-59/10 * * * *') ||
      (vars.MONITOR_INTERVAL_MINUTES == '15' && github.event.schedule == '1-59/15 * * * *') ||
      (vars.MONITOR_INTERVAL_MINUTES == '30' && github.event.schedule == '3,33 * * * *') ||
      (vars.MONITOR_INTERVAL_MINUTES == '60' && github.event.schedule == '6 * * * *')
    runs-on: ubuntu-22.04

    steps:
    - name: Baixar o código do repositório
      uses: actions/checkout@v3

    - name: Configurar o Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Instalar dependências do Python
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Instalar navegadores do Playwright
      run: |
        python -m playwright install chromium
        python -m playwright install-deps chromium

    - name: Executar o monitoramento de preço
      env:
        TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        PRECO_MAXIMO: ${{ vars.PRECO_MAXIMO }}
      run: python latam.py